# Site Manager 监控配置
# 使用: site monitor config 查看/修改

# 基础配置
MONITOR_ENABLED=false
MONITOR_INTERVAL=5           # 检查间隔 (分钟)
MONITOR_HOST_NAME=""         # 主机标识 (留空自动获取 hostname)

# Telegram 配置
TG_BOT_TOKEN=""
TG_CHAT_ID=""

# 监控项开关
CHECK_WEBSITES=true          # 网站可访问性
CHECK_SSL=true               # SSL 证书过期
CHECK_DISK=true              # 磁盘空间
CHECK_SERVICES=true          # 系统服务 (Nginx/PHP/MySQL)
CHECK_SUPERVISOR=true        # Supervisor 进程
CHECK_BACKUP=true            # 备份状态

# 阈值设置
DISK_WARN_PERCENT=80         # 磁盘警告阈值 (%)
DISK_CRIT_PERCENT=90         # 磁盘危险阈值 (%)
SSL_WARN_DAYS=14             # SSL 警告天数
SSL_CRIT_DAYS=7              # SSL 危险天数
BACKUP_MAX_AGE=24            # 备份最大间隔 (小时)
